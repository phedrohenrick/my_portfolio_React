<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Geist Mono, ui-monospace, monospace">
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#012c32" stroke-width="1.5"/>
    </marker>
    <marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#f7fbfa" stroke="#012c32" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#f7fbfa"/>
  <text x="40" y="58" font-size="16" fill="#5f7679">// abstraction in java</text>

  <!-- class (azul): conhece só a interface -->
  <rect x="40" y="110" width="200" height="96" rx="16" fill="#7ba7c2"/>
  <text x="140" y="148" font-size="13" fill="#f7fbfa" text-anchor="middle">class</text>
  <text x="140" y="174" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">CheckoutService</text>

  <!-- interface -->
  <rect x="520" y="110" width="240" height="96" rx="16" fill="#ffffff" stroke="#8dbfae" stroke-width="2.5"/>
  <text x="640" y="148" font-size="13" fill="#2f6b57" text-anchor="middle">«interface»</text>
  <text x="640" y="174" font-size="16" font-weight="600" fill="#012c32" text-anchor="middle">PaymentService</text>

  <!-- abstract class -->
  <rect x="520" y="262" width="240" height="72" rx="16" fill="#ffffff" stroke="#9bb4d4" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="640" y="292" font-size="13" fill="#44618a" text-anchor="middle">abstract class</text>
  <text x="640" y="316" font-size="15" font-weight="600" fill="#012c32" text-anchor="middle" font-style="italic">CreditCardPayment</text>

  <!-- subclass -->
  <rect x="200" y="262" width="240" height="72" rx="16" fill="#ffffff" stroke="#6fa8a8" stroke-width="2.5"/>
  <text x="320" y="292" font-size="13" fill="#2f6b6e" text-anchor="middle">subclass</text>
  <text x="320" y="316" font-size="15" font-weight="600" fill="#012c32" text-anchor="middle">VisaPayment</text>

  <!-- uses -->
  <line x1="240" y1="158" x2="518" y2="158" stroke="#012c32" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)"/>
  <text x="379" y="148" font-size="13" fill="#5f7679" text-anchor="middle">uses</text>

  <!-- implements -->
  <line x1="640" y1="262" x2="640" y2="208" stroke="#012c32" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#tri)"/>
  <text x="652" y="240" font-size="13" fill="#5f7679">implements</text>

  <!-- extends -->
  <line x1="440" y1="298" x2="518" y2="298" stroke="#012c32" stroke-width="1.5" marker-end="url(#tri)"/>
  <text x="479" y="288" font-size="13" fill="#5f7679" text-anchor="middle">extends</text>

  <text x="40" y="406" font-size="13" fill="#5f7679">the blue class knows only the interface</text>
</svg>
